<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form>
            <div class="form-group">
                <label for="username">Email</label>
                <input type="text" id="username" name="username" placeholder="please fill your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="please fill your password" required minlength="6">
            </div>
            <button type="button" class="login-btn" onclick="validateForm()">Sign In</button>
            <div class="extra-links">
                <a href="index.html">Home?</a> | 
                <a href="register.html">Create Account</a>
            </div>
        </form>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
