<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MovieReview - TV Shows">
  <title>MovieReview - TV Shows</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>
  <div class="site-layout">
    <aside id="sidebar"></aside>
    <main class="main-content">
      <section class="page-header">
        <div>
          <span class="section-label">DISCOVER</span>
          <h1>TV Shows</h1>
          <p>Browse TV series, episodes, and latest releases.</p>
        </div>
      </section>
      <section class="filter-section">
        <div class="search-box">
          <input type="text" id="movie-search" placeholder="Search TV shows...">
          <span>🔍</span>
        </div>
        <select id="genre-filter"><option value="all">All Genres</option></select>
        <select id="sort-filter">
          <option value="default">Sort By</option>
          <option value="title-asc">Title A-Z</option>
          <option value="title-desc">Title Z-A</option>
          <option value="year-desc">Newest</option>
          <option value="year-asc">Oldest</option>
        </select>
      </section>
      <section class="content-section movies-page">
        <div class="section-header">
          <div>
            <span class="section-label">EXPLORE</span>
            <h2>TV Shows</h2>
          </div>
          <div id="tv-show-count" class="movie-count"></div>
        </div>
        <div id="tv-shows-container" class="movie-grid"></div>
        <div id="no-results" class="no-results hidden">
          <h2>No TV shows found</h2>
          <p>Try changing your search or filter.</p>
        </div>
      </section>
    </main>
  </div>
  <div id="footer"></div>
  <script src="js/header.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/tv-show.js"></script>
</body>
</html>
